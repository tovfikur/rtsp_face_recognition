<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Face Detection</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">
          <i class="bi bi-camera-video-fill me-2"></i>
          Face Recognition System
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">
                <i class="bi bi-speedometer2 me-1"></i>Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/rtsp/manage">
                <i class="bi bi-camera-reels me-1"></i>RTSP Streams
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/logout">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <!-- Header -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="text-center">
            <h1 class="display-5 fw-bold text-primary mb-3">
              <i class="bi bi-eye-fill me-2"></i>
              Live Face Detection
            </h1>
            <p class="lead text-muted">
              Use your webcam for real-time face detection and recognition
            </p>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-center gap-3">
                <button
                  id="startBtn"
                  class="btn btn-success btn-lg px-4"
                  onclick="startDetection()"
                >
                  <i class="bi bi-play-circle-fill me-2"></i>
                  Start Detection
                </button>
                <button
                  id="stopBtn"
                  class="btn btn-danger btn-lg px-4"
                  onclick="stopDetection()"
                  disabled
                >
                  <i class="bi bi-stop-circle-fill me-2"></i>
                  Stop Detection
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Video and Status -->
      <div class="row">
        <!-- Video Container -->
        <div class="col-lg-8 mb-4">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-dark text-white">
              <h5 class="card-title mb-0">
                <i class="bi bi-camera-video me-2"></i>
                Live Video Feed
              </h5>
            </div>
            <div class="card-body text-center p-4">
              <video
                id="video"
                class="img-fluid border rounded"
                width="640"
                height="480"
                autoplay
              ></video>
              <canvas
                id="canvas"
                width="640"
                height="480"
                style="display: none"
              ></canvas>
            </div>
          </div>
        </div>

        <!-- Status and Log -->
        <div class="col-lg-4">
          <!-- Status Card -->
          <div class="card shadow-sm mb-4">
            <div class="card-header bg-info text-white">
              <h5 class="card-title mb-0">
                <i class="bi bi-activity me-2"></i>
                Detection Status
              </h5>
            </div>
            <div class="card-body">
              <div
                id="status"
                class="alert alert-secondary text-center"
                role="alert"
              >
                <i class="bi bi-circle me-2"></i>
                Ready to start detection
              </div>
            </div>
          </div>

          <!-- Detection Log -->
          <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">
              <h5 class="card-title mb-0">
                <i class="bi bi-list-ul me-2"></i>
                Detection Log
              </h5>
            </div>
            <div class="card-body p-0">
              <div
                class="list-group list-group-flush"
                id="logList"
                style="max-height: 300px; overflow-y: auto"
              >
                <div class="list-group-item text-muted text-center py-3">
                  <i class="bi bi-clock-history me-2"></i>
                  No detections yet
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let socket = null;
      let stream = null;
      let detectionInterval = null;
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const statusDiv = document.getElementById("status");
      const logList = document.getElementById("logList");

      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
      }

      function updateStatus(message, type) {
        const iconMap = {
          success: "bi-check-circle-fill",
          error: "bi-x-circle-fill",
          warning: "bi-exclamation-triangle-fill",
          info: "bi-info-circle-fill",
        };

        const alertMap = {
          success: "alert-success",
          error: "alert-danger",
          warning: "alert-warning",
          info: "alert-info",
        };

        const icon = iconMap[type] || "bi-circle";
        const alertClass = alertMap[type] || "alert-secondary";

        statusDiv.className = `alert ${alertClass} text-center`;
        statusDiv.innerHTML = `<i class="${icon} me-2"></i>${message}`;
      }

      function addLog(message, type = "info") {
        // Clear "no detections" message if it exists
        if (
          logList.children.length === 1 &&
          logList.children[0].classList.contains("text-muted")
        ) {
          logList.innerHTML = "";
        }

        const iconMap = {
          success: "bi-check-circle text-success",
          error: "bi-x-circle text-danger",
          warning: "bi-exclamation-triangle text-warning",
          info: "bi-info-circle text-info",
        };

        const icon = iconMap[type] || "bi-circle text-secondary";
        const timestamp = new Date().toLocaleTimeString();

        const listItem = document.createElement("div");
        listItem.className = "list-group-item list-group-item-action";
        listItem.innerHTML = `
          <div class="d-flex justify-content-between align-items-center">
            <span><i class="${icon} me-2"></i>${message}</span>
            <small class="text-muted">${timestamp}</small>
          </div>
        `;

        logList.insertBefore(listItem, logList.firstChild);

        // Keep only last 10 entries
        if (logList.children.length > 10) {
          logList.removeChild(logList.lastChild);
        }
      }

      async function startDetection() {
        try {
          updateStatus("Requesting camera access...", "info");

          // Get webcam access
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              width: 640,
              height: 480,
            },
          });
          video.srcObject = stream;

          // Connect WebSocket
          const token = getCookie("token");
          if (!token) {
            updateStatus(
              "No authentication token found. Please login.",
              "error"
            );
            return;
          }

          updateStatus("Connecting to detection service...", "info");

          const protocol =
            window.location.protocol === "https:" ? "wss:" : "ws:";
          socket = new WebSocket(
            `${protocol}//${window.location.host}/ws/detection?token=${token}`
          );

          socket.onopen = () => {
            updateStatus("Detection active - Monitoring for faces", "success");
            addLog("WebSocket connected successfully", "success");
            document.getElementById("startBtn").disabled = true;
            document.getElementById("stopBtn").disabled = false;

            // Start sending frames
            detectionInterval = setInterval(captureAndSend, 1000);
          };

          socket.onmessage = (event) => {
            try {
              const results = JSON.parse(event.data);
              if (Array.isArray(results) && results.length > 0) {
                const detectedFaces = results.filter(
                  (r) => r !== "Unknown" && r !== "No registered faces"
                );
                if (detectedFaces.length > 0) {
                  updateStatus(
                    `Recognized: ${detectedFaces.join(", ")}`,
                    "success"
                  );
                  detectedFaces.forEach((face) =>
                    addLog(`Face detected: ${face}`, "success")
                  );
                } else if (results.includes("Unknown")) {
                  updateStatus("Unknown face detected", "warning");
                  addLog("Unknown face detected", "warning");
                } else {
                  updateStatus("No registered faces to compare", "info");
                }
              } else {
                updateStatus("No faces detected", "info");
              }
            } catch (e) {
              // Handle non-JSON responses
              const personId = event.data;
              if (personId === "unknown" || personId === "Unknown") {
                updateStatus("Unknown face detected", "warning");
                addLog("Unknown face detected", "warning");
              } else {
                updateStatus(`Recognized: ${personId}`, "success");
                addLog(`Face detected: ${personId}`, "success");
              }
            }
          };

          socket.onclose = () => {
            updateStatus("Connection lost", "error");
            addLog("WebSocket disconnected", "error");
            stopDetection();
          };

          socket.onerror = (error) => {
            updateStatus("Connection error", "error");
            addLog("WebSocket connection error", "error");
            console.error("WebSocket error:", error);
          };
        } catch (error) {
          updateStatus("Failed to access webcam: " + error.message, "error");
          addLog("Camera access denied", "error");
          console.error("Error:", error);
        }
      }

      function captureAndSend() {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;

        // Draw video frame to canvas
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Convert to base64 and send
        canvas.toBlob(
          (blob) => {
            if (!blob || !socket || socket.readyState !== WebSocket.OPEN)
              return;

            const reader = new FileReader();
            reader.onloadend = () => {
              if (socket && socket.readyState === WebSocket.OPEN) {
                const base64data = reader.result.split(",")[1];
                socket.send(base64data);
              }
            };
            reader.readAsDataURL(blob);
          },
          "image/jpeg",
          0.8
        );
      }

      function stopDetection() {
        // Stop sending frames
        if (detectionInterval) {
          clearInterval(detectionInterval);
          detectionInterval = null;
        }

        // Close WebSocket
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.close();
        }

        // Stop webcam
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          video.srcObject = null;
          stream = null;
        }

        document.getElementById("startBtn").disabled = false;
        document.getElementById("stopBtn").disabled = true;
        updateStatus("Detection stopped", "info");
        addLog("Detection stopped by user", "info");
      }

      // Cleanup on page unload
      window.addEventListener("beforeunload", () => {
        stopDetection();
      });
    </script>
  </body>
</html>
